<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Доступ закрыт</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f3ee;
        color: #1f2933;
        font-family: Inter, Arial, sans-serif;
      }
      main {
        width: min(640px, 100%);
        border: 1px solid #dfd6c8;
        border-radius: 12px;
        background: #fffaf3;
        padding: 28px;
        box-shadow: 0 18px 50px rgba(31, 41, 51, 0.12);
      }
      h1 { margin: 0; font-size: clamp(32px, 5vw, 48px); line-height: 1.05; }
      p { margin: 14px 0 0; color: #637083; font-size: 17px; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <h1>Доступ закрыт</h1>
      <p>Публичная версия приложения временно недоступна. Доступ к тестам предоставляется через закрытую страницу сервиса.</p>
    </main>
  </body>
</html>
